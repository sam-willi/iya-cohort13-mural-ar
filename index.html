<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>I Spy · IYA Cohort 13 Mural</title>
    <meta name="theme-color" content="#2e1b0e" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://aframe.io" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Display:wdth,wght@62.5,900&family=Oswald:wght@500;600&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- A-Frame (3D scene) + MindAR (image tracking). Pinned versions: MindAR 1.2.5 is tested with A-Frame 1.5.0.
         `defer` lets the start screen show straight away while these ~660 KB download; they still run in order,
         before js/app.js. Only the weights the CSS uses are requested from Google Fonts (see docs/compression.md). -->
    <script defer src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="js/app.js" type="module"></script>
  </head>
  <body>
    <!-- 1. Start screen: the mural's I Spy badge in front of a workshop scene drawn in the mural's style (camera permission is requested when "Start" is tapped) -->
    <section id="start-screen" class="screen cover">
      <div class="scene-bg" aria-hidden="true"></div>
      <div class="badge">
        <svg class="badge-arc" viewBox="0 0 200 200" aria-hidden="true">
          <path id="arc-start" d="M 18 100 A 82 82 0 0 1 182 100" fill="none" />
          <text><textPath href="#arc-start" startOffset="50%" text-anchor="middle">USC Bestselling Series</textPath></text>
        </svg>
        <h1 class="logo">I SPY</h1>
        <p class="badge-title">IYA Cohort 13</p>
        <p class="badge-signed">Signed by <b>Cohort 13</b></p>
      </div>
      <div class="cover-actions">
        <button id="start-button" class="btn btn-primary btn-big" disabled>Loading…</button>
        <p class="fine-print">Solve each riddle, find the object on the mural, and watch it come to life.<br />You'll be asked to allow camera access.</p>
        <button id="picture-button" class="btn btn-quiet" hidden>No camera? Play on a picture of the mural</button>
      </div>
    </section>

    <!-- No-camera mode: the same game played by tapping objects on a picture of the mural (scroll and zoom to search) -->
    <section id="picture-view" class="picture-view" hidden>
      <div id="picture-scroll" class="picture-scroll">
        <div id="picture-wall" class="picture-wall">
          <img id="picture-img" alt="The Cohort 13 I Spy mural" draggable="false" />
          <span id="picture-lens" class="picture-lens" aria-hidden="true" hidden></span>
          <span id="picture-miss" class="picture-miss" aria-hidden="true" hidden></span>
        </div>
      </div>
      <div class="picture-zoom">
        <button id="zoom-in" class="btn" aria-label="Zoom in">+</button>
        <button id="zoom-out" class="btn" aria-label="Zoom out">&minus;</button>
      </div>
    </section>

    <!-- Shown when the camera is on the wrong part of the mural; the arrow appears after a hint or a few wrong tries -->
    <div id="direction" class="direction" role="status" aria-live="polite" hidden>
      <span id="direction-arrow" class="direction-arrow" aria-hidden="true" hidden></span>
      <span id="direction-text"></span>
    </div>

    <!-- Magnifying glass (from the mural) shown over the camera while the player searches.
         When the object is found it flies to the object's spot and becomes the lens in AR,
         and the object's 3D rendering rises out of it and spins. -->
    <div id="magnifier" class="magnifier" aria-hidden="true" hidden>
      <span class="magnifier-lens"></span>
      <span class="magnifier-handle"></span>
    </div>

    <!-- 2. Riddle card, shown over the camera while the player searches -->
    <section id="riddle-card" class="card card-bottom" hidden>
      <span class="mini-badge" aria-hidden="true">I SPY</span>
      <p class="eyebrow">Riddle <span id="progress"></span></p>
      <p id="riddle-text" class="riddle"></p>
      <p id="hint-text" class="hint" hidden></p>
      <div class="row">
        <button id="hint-button" class="btn">Hint</button>
        <button id="skip-button" class="btn">Skip</button>
      </div>
    </section>

    <!-- 3. Found card, shown once the right object pops out -->
    <section id="found-card" class="card card-bottom" hidden>
      <span class="mini-badge" aria-hidden="true">I SPY</span>
      <p class="eyebrow">You spied it!</p>
      <h2 id="found-name" class="found-name"></h2>
      <p id="found-student" class="found-student"></p>
      <div id="found-model" class="found-model" hidden></div>
      <svg id="mini-map" class="mini-map" role="img" aria-label="Where it is on the mural"></svg>
      <p id="found-where" class="found-where"></p>
      <div class="row">
        <a id="student-link" class="btn btn-primary" target="_blank" rel="noopener">Meet the artist</a>
        <button id="next-button" class="btn">Next riddle</button>
      </div>
    </section>

    <!-- 4. End screen -->
    <section id="done-screen" class="screen cover" hidden>
      <div class="scene-bg" aria-hidden="true"></div>
      <div class="badge">
        <svg class="badge-arc" viewBox="0 0 200 200" aria-hidden="true">
          <path id="arc-done" d="M 18 100 A 82 82 0 0 1 182 100" fill="none" />
          <text><textPath href="#arc-done" startOffset="50%" text-anchor="middle">USC Bestselling Series</textPath></text>
        </svg>
        <h1 class="logo logo-long">I SPIED</h1>
        <p class="badge-title">Them All!</p>
        <p class="badge-signed">Thanks for exploring <b>Cohort 13</b>'s mural</p>
      </div>
      <div class="cover-actions">
        <button id="restart-button" class="btn btn-primary btn-big">Play again</button>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <!--
      The AR scene. It sits in a <template> so it's only added to the page (by js/app.js) after A-Frame and MindAR
      have loaded: A-Frame breaks if it finds a scene that already exists. One <a-entity mindar-image-target> per
      target is added from data/objects.json; targets/targets.mind holds the compiled images (docs/adding-an-object.md).
    -->
    <template id="ar-scene-template">
      <a-scene
        id="ar-scene"
        mindar-image="imageTargetSrc: targets/targets.mind; autoStart: false; maxTrack: 1; uiScanning: no; uiLoading: yes; uiError: yes; filterMinCF: 0.0001; filterBeta: 0.001"
        gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
      >
        <a-assets id="assets"></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <!-- warm light for the 3D renderings, like the mural's lamps -->
        <a-light type="hemisphere" color="#fff6e5" ground-color="#6b4122" intensity="2.2"></a-light>
        <a-light type="directional" position="0.6 1 1.4" intensity="2.4"></a-light>
      </a-scene>
    </template>
  </body>
</html>
