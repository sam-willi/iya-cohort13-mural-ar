<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>I Spy · IYA Cohort 13 Mural</title>
    <meta name="theme-color" content="#1a120c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@500;600&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- A-Frame (3D scene) + MindAR (image tracking). Pinned versions: MindAR 1.2.5 is tested with A-Frame 1.5.0. -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="js/app.js" type="module"></script>
  </head>
  <body>
    <!-- 1. Start screen, styled like an I Spy book cover (camera permission is requested when "Start" is tapped) -->
    <section id="start-screen" class="screen cover">
      <svg class="clutter" aria-hidden="true"></svg>
      <div class="badge">
        <svg class="badge-arc" viewBox="0 0 200 200" aria-hidden="true">
          <path id="arc-start" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
          <text><textPath href="#arc-start" startOffset="50%" text-anchor="middle">IYA Cohort 13 Mural</textPath></text>
        </svg>
        <h1 class="logo">I SPY</h1>
        <p class="badge-sub">A Mural of Picture Riddles</p>
        <p class="badge-credits">Art by <em>IYA Cohort 13</em></p>
      </div>
      <div class="cover-actions">
        <button id="start-button" class="btn btn-primary btn-big" disabled>Loading…</button>
        <p class="fine-print">Find each object on the mural and watch it come to life.<br />You'll be asked to allow camera access.</p>
      </div>
      <p class="publisher-tab">IYA · Cohort 13</p>
    </section>

    <!-- 2. Riddle card, shown over the camera while the player searches -->
    <section id="riddle-card" class="card card-bottom" hidden>
      <span class="mini-badge" aria-hidden="true">I SPY</span>
      <p class="eyebrow">Riddle <span id="progress"></span></p>
      <p id="riddle-text" class="riddle"></p>
      <p id="hint-text" class="hint" hidden></p>
      <div class="row">
        <button id="hint-button" class="btn">Hint</button>
        <button id="skip-button" class="btn">Skip</button>
      </div>
    </section>

    <!-- 3. Found card, shown once the right object pops out -->
    <section id="found-card" class="card card-bottom" hidden>
      <span class="mini-badge" aria-hidden="true">I SPY</span>
      <p class="eyebrow">You spied it!</p>
      <h2 id="found-name" class="found-name"></h2>
      <p id="found-student" class="found-student"></p>
      <div class="row">
        <a id="student-link" class="btn btn-primary" target="_blank" rel="noopener">Meet the artist</a>
        <button id="next-button" class="btn">Next riddle</button>
      </div>
    </section>

    <!-- 4. End screen -->
    <section id="done-screen" class="screen cover" hidden>
      <svg class="clutter" aria-hidden="true"></svg>
      <div class="badge">
        <svg class="badge-arc" viewBox="0 0 200 200" aria-hidden="true">
          <path id="arc-done" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
          <text><textPath href="#arc-done" startOffset="50%" text-anchor="middle">IYA Cohort 13 Mural</textPath></text>
        </svg>
        <h1 class="logo logo-long">I SPIED</h1>
        <p class="badge-sub badge-sub-big">Them All!</p>
        <p class="badge-credits">Thanks for exploring the mural</p>
      </div>
      <div class="cover-actions">
        <button id="restart-button" class="btn btn-primary btn-big">Play again</button>
      </div>
      <p class="publisher-tab">IYA · Cohort 13</p>
    </section>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <!--
      The AR scene. One <a-entity mindar-image-target> per mural object is added by js/app.js
      from data/objects.json. targets/targets.mind holds the compiled images (see docs/adding-an-object.md).
    -->
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: targets/targets.mind; autoStart: false; maxTrack: 1; uiScanning: no; uiLoading: yes; uiError: yes; filterMinCF: 0.0001; filterBeta: 0.001"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets id="assets"></a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-light type="ambient" intensity="1.2"></a-light>
      <a-light type="directional" position="0 1 1" intensity="1"></a-light>
    </a-scene>
  </body>
</html>
